[workspace]
members = [
    "sz_common",
    "sz_aes_plugin",
    "sz_dummy_plugin"
]
resolver = "3"

[workspace.package]
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
sz_common = { path = "sz_common", version = "0.1.0" }
aes = "0.9"
cbc = "0.2"
base64 = "0.23"
zeroize = "1.8"
thiserror = "2"
libc = "0.2"
